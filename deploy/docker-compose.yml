# Production stack on the banrukrot.com VPS (/home/deploy/pos). Rules from the VPS handoff:
# every service is pos-*, nothing publishes a host port, every service has a memory limit (total 1.1 GB),
# and only pos-frontend joins the Nginx Proxy Manager network. Secrets live in /home/deploy/pos/.env.
name: pos

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  pos-db:
    image: postgres:16-alpine
    container_name: pos-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD:?POS_DB_PASSWORD is required}
      POSTGRES_DB: prakai
    volumes:
      - pos_db_data:/var/lib/postgresql/data
    networks: [internal]
    labels: { project: pos }
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 512M, cpus: '0.75' }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "prakai"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pos-backend:
    image: ${REGISTRY_URL:-registry.banrukrot.com}/pos-backend:latest
    container_name: pos-backend
    restart: always
    depends_on:
      pos-db: { condition: service_healthy }
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POS_DB_PASSWORD}@pos-db:5432/prakai
      DATABASE_URL: postgres://prakai_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@pos-db:5432/prakai
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks: [internal]              # reached only by pos-frontend, never by the proxy
    labels: { project: pos }
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.50' }

  pos-frontend:
    image: ${REGISTRY_URL:-registry.banrukrot.com}/pos-frontend:latest
    container_name: pos-frontend
    restart: always
    depends_on:
      pos-backend: { condition: service_healthy }
    networks: [internal, proxy]
    labels: { project: pos }
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.50' }

  # Nightly pg_dump kept 14 days in ./backups on the VPS. Same machine only — copy off-site separately.
  pos-backup:
    image: postgres:16-alpine
    container_name: pos-backup
    restart: always
    depends_on:
      pos-db: { condition: service_healthy }
    environment:
      PGHOST: pos-db
      PGUSER: postgres
      PGPASSWORD: ${POS_DB_PASSWORD}
      PGDATABASE: prakai
    volumes:
      - ./backups:/backups
    command: ["sh", "-c", "while true; do f=/backups/prakai-$$(date +%F).dump; pg_dump -Fc -f $$f.tmp && mv $$f.tmp $$f; find /backups -name 'prakai-*.dump' -mtime +14 -delete; sleep 86400; done"]
    networks: [internal]
    labels: { project: pos }
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 128M, cpus: '0.25' }

networks:
  internal: {}
  proxy:
    external: true
    name: loei-banrakrod_default

volumes:
  pos_db_data:
